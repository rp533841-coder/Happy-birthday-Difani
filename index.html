<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#eee5ff" />
<title>A Little Birthday Letter — 11 April</title>
<style>
  :root{--ink:#34284b;--muted:#817394;--rose:#9b79d2;--rose-dark:#7654b2;--paper:#fffdfb;--line:#e8def7;--shadow:0 22px 70px rgba(54,35,91,.18)}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 12%,#fff0ff 0,transparent 26%),radial-gradient(circle at 88% 82%,#d9c7ff 0,transparent 32%),radial-gradient(circle at 50% 50%,#f1eaff 0,#e6dcfb 52%,#cbb8ed 100%);display:grid;place-items:center;padding:24px;overflow-x:hidden}
  .sparkle{position:fixed;color:#9672c9;opacity:.62;pointer-events:none;animation:float 7s ease-in-out infinite}.s1{top:9%;left:9%;font-size:25px}.s2{top:18%;right:12%;font-size:18px;animation-delay:1s}.s3{bottom:12%;left:14%;font-size:22px;animation-delay:2s}.s4{bottom:19%;right:9%;font-size:28px;animation-delay:3s}
  @keyframes float{50%{transform:translateY(-13px) rotate(12deg)}}
  .wrap{width:min(100%,650px);position:relative}.topline{text-align:center;margin-bottom:17px;color:var(--rose-dark);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
  .card{background:rgba(255,253,255,.94);border:1px solid rgba(202,181,232,.8);border-radius:28px;padding:clamp(25px,6vw,52px);box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:490px;display:flex;flex-direction:column}
  .card:before{content:"";position:absolute;inset:10px;border:1px solid #e9def8;border-radius:21px;pointer-events:none}
  .content{position:relative;z-index:1;display:flex;flex-direction:column;flex:1}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-dark);font-weight:700;margin:4px 0 18px}
  h1{font-family:Georgia,serif;font-size:clamp(34px,7vw,52px);line-height:1.12;font-weight:500;margin:0 0 16px;color:#554447}
  .message{font-family:Georgia,serif;font-size:clamp(23px,4.7vw,31px);line-height:1.45;margin:18px 0 16px;color:#554447}
  .sub{font-size:15px;line-height:1.7;color:var(--muted);margin:0 0 22px}
  .date{display:inline-flex;align-self:flex-start;align-items:center;gap:9px;border:1px solid var(--line);background:#f7f2ff;border-radius:99px;padding:9px 15px;color:#7654a8;font-size:13px;margin:5px 0 25px}
  .progress{height:4px;background:#eee6f8;border-radius:9px;margin:0 0 28px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#c4a7ef,#805bbd);border-radius:9px;transition:width .35s ease}
  label{font-size:13px;color:#8b777a;font-weight:650;margin:4px 0 9px}textarea{width:100%;min-height:105px;resize:vertical;border:1px solid #efdddd;border-radius:15px;background:#fffafa;padding:14px 15px;font:15px/1.6 inherit;color:var(--ink);outline:none;transition:border .2s,box-shadow .2s}textarea:focus{border-color:#d99aa2;box-shadow:0 0 0 3px #f8e9e9}textarea::placeholder{color:#c1afb1}
  .actions{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:24px;position:relative;z-index:1}.btn{border:0;border-radius:99px;padding:13px 22px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .2s,background .2s}.btn:hover{transform:translateY(-2px)}.primary{background:var(--rose);color:white;box-shadow:0 7px 18px #7654b240}.primary:hover{background:var(--rose-dark)}.secondary{background:transparent;color:#806b9b;padding-left:5px;padding-right:5px}.secondary:disabled{opacity:.25;cursor:default;transform:none}
  .step{text-align:center;color:#b39da0;font-size:12px;margin-top:18px;letter-spacing:.08em}.heart{font-size:38px;margin:2px 0 12px;color:#9672c9}.intro{text-align:center;align-items:center;justify-content:center}.intro .sub{max-width:420px}.intro h1{max-width:470px}.intro .date{align-self:center}.intro .actions{justify-content:center}.summary{width:100%;display:grid;gap:12px;margin:18px 0}.answer{background:#f8f4ff;border:1px solid #e9def8;border-radius:14px;padding:13px 15px;text-align:left}.answer strong{display:block;font-size:13px;color:#7654a8;margin-bottom:5px}.answer span{font-size:14px;line-height:1.5;color:#65575a;white-space:pre-wrap;overflow-wrap:anywhere}.footer{text-align:center;color:#b49fa1;font-size:11px;margin-top:17px;letter-spacing:.08em}
  .iris{position:fixed;width:clamp(125px,19vw,245px);height:auto;opacity:.86;pointer-events:none;filter:drop-shadow(0 12px 16px rgba(67,42,111,.16));z-index:0;animation:irisFloat 9s ease-in-out infinite}
  .iris-left{left:-25px;bottom:-18px;transform:rotate(-13deg)}.iris-right{right:-24px;top:-18px;transform:rotate(165deg);animation-delay:2s}
  @keyframes irisFloat{50%{translate:0 -10px;rotate:3deg}}
  .wrap{z-index:1}

  /* Birthday finale: gently animated cake, blossoms and floating petals */
  .celebration{position:relative;width:min(100%,390px);height:245px;margin:8px auto 2px;display:grid;place-items:end center;overflow:hidden}
  .cake{position:relative;width:190px;height:145px;z-index:2;animation:cakeIn 1s cubic-bezier(.2,.8,.2,1) both}
  .cake-top{position:absolute;left:17px;top:37px;width:156px;height:37px;border-radius:50%;background:#fff0fb;border:3px solid #d8b9f0;z-index:3;box-shadow:inset 0 -7px 0 #ead8fb}
  .cake-top:after{content:"";position:absolute;left:10px;right:10px;top:9px;height:10px;border-radius:50%;background:#d5b5f0;opacity:.75}
  .cake-layer{position:absolute;left:17px;top:54px;width:156px;height:65px;background:linear-gradient(90deg,#b995e3,#e0c9f7 48%,#a982d5);border:3px solid #c5a4e6;border-top:0;border-radius:0 0 18px 18px;box-shadow:inset 0 -9px 0 rgba(112,70,158,.13),0 13px 18px rgba(85,54,125,.15)}
  .icing{position:absolute;left:17px;top:66px;width:156px;height:22px;z-index:4;display:flex;justify-content:space-around}
  .icing i{display:block;width:17px;height:23px;background:#fff0fb;border-radius:0 0 12px 12px}
  .candle{position:absolute;left:91px;top:4px;width:10px;height:38px;border-radius:4px;background:repeating-linear-gradient(135deg,#fff 0 5px,#b18bdf 5px 10px);z-index:5}
  .flame{position:absolute;left:89px;top:-17px;width:14px;height:21px;background:radial-gradient(ellipse at 50% 65%,#fff6b8 0 24%,#ffc65f 45%,#f28b67 75%);border-radius:55% 45% 55% 45%;transform:rotate(8deg);filter:drop-shadow(0 0 8px #ffc76b);transform-origin:50% 100%;animation:flicker .65s ease-in-out infinite alternate}
  .cake-plate{position:absolute;left:0;bottom:13px;width:190px;height:20px;border-radius:50%;background:linear-gradient(#f8efff,#c6a8e8);box-shadow:0 8px 14px rgba(76,48,111,.13)}
  /* Wrapped purple iris bouquet beside the birthday cake */
  .bouquet{position:absolute;right:0;bottom:3px;width:148px;height:184px;z-index:3;transform-origin:50% 100%;animation:bouquetIn 1.15s .25s cubic-bezier(.2,.8,.2,1) both,bouquetSway 5s 1.4s ease-in-out infinite}
  .bouquet svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 9px 9px rgba(65,43,94,.16))}
  .bouquet-ribbon{animation:ribbonFlutter 3s ease-in-out infinite;transform-origin:50% 75%}
  .petal-fall{position:absolute;top:-20px;z-index:4;color:#a47bd2;font-size:19px;pointer-events:none;animation:petalDrift 5s linear infinite;opacity:0}
  .petal-fall.pf1{left:15%;animation-delay:.2s}.petal-fall.pf2{left:38%;animation-delay:1.7s;font-size:14px}.petal-fall.pf3{left:70%;animation-delay:.9s}.petal-fall.pf4{left:87%;animation-delay:2.5s;font-size:15px}
  @keyframes cakeIn{from{opacity:0;transform:translateY(35px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes flicker{from{transform:rotate(-7deg) scale(.92,1)}to{transform:rotate(8deg) scale(1.08,.94)}}
  @keyframes bouquetIn{from{opacity:0;transform:translateY(28px) scale(.75)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes bouquetSway{0%,100%{rotate:0deg}50%{rotate:2deg}}
  @keyframes ribbonFlutter{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
  @keyframes petalDrift{0%{opacity:0;transform:translateY(-10px) rotate(0)}12%{opacity:.8}85%{opacity:.7}100%{opacity:0;transform:translateY(255px) rotate(250deg)}}
  @media(prefers-reduced-motion:reduce){.cake,.bouquet,.bouquet-ribbon,.flame,.petal-fall{animation:none!important}}
  @media(max-width:520px){body{padding:14px}.card{min-height:560px;border-radius:23px}.actions{margin-top:18px}.btn{padding:12px 18px}.message{margin-top:10px}}
</style>
</head>
<body>
<svg class="iris iris-left" viewBox="0 0 220 300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="petalA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8c4ff"/><stop offset=".55" stop-color="#9670d0"/><stop offset="1" stop-color="#59358f"/></linearGradient><linearGradient id="petalB" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#f0e5ff"/><stop offset="1" stop-color="#8057bd"/></linearGradient></defs>
 <path d="M112 288 C116 230 115 180 108 125" fill="none" stroke="#66865c" stroke-width="5" stroke-linecap="round"/><path d="M112 230 C65 205 42 210 24 244 C65 238 91 245 112 260" fill="#78976a"/><path d="M113 202 C153 166 181 171 199 204 C164 197 138 207 113 225" fill="#86a274"/>
 <path d="M108 139 C68 115 64 70 91 30 C112 58 117 91 108 139" fill="url(#petalA)"/><path d="M108 139 C85 88 105 43 137 18 C151 62 139 106 108 139" fill="url(#petalB)"/><path d="M108 139 C125 91 164 73 195 87 C181 126 148 146 108 139" fill="url(#petalA)"/><path d="M108 139 C74 143 42 126 30 96 C66 83 94 103 108 139" fill="url(#petalB)"/><path d="M108 139 C86 159 78 193 94 220 C120 194 123 163 108 139" fill="#7650ad"/><path d="M108 139 C125 157 150 166 174 151 C158 127 132 124 108 139" fill="#a886db"/><path d="M109 132 C117 127 126 131 128 139 C119 145 111 143 106 138Z" fill="#f3d36e"/><path d="M108 141 C117 149 127 151 138 148" fill="none" stroke="#f5d77b" stroke-width="4" stroke-linecap="round"/>
</svg>
<svg class="iris iris-right" viewBox="0 0 220 300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="petalC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4d5ff"/><stop offset=".55" stop-color="#a17bd8"/><stop offset="1" stop-color="#65409a"/></linearGradient><linearGradient id="petalD" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#f5edff"/><stop offset="1" stop-color="#8962c3"/></linearGradient></defs>
 <path d="M112 288 C116 230 115 180 108 125" fill="none" stroke="#66865c" stroke-width="5" stroke-linecap="round"/><path d="M112 230 C65 205 42 210 24 244 C65 238 91 245 112 260" fill="#78976a"/><path d="M113 202 C153 166 181 171 199 204 C164 197 138 207 113 225" fill="#86a274"/>
 <path d="M108 139 C68 115 64 70 91 30 C112 58 117 91 108 139" fill="url(#petalC)"/><path d="M108 139 C85 88 105 43 137 18 C151 62 139 106 108 139" fill="url(#petalD)"/><path d="M108 139 C125 91 164 73 195 87 C181 126 148 146 108 139" fill="url(#petalC)"/><path d="M108 139 C74 143 42 126 30 96 C66 83 94 103 108 139" fill="url(#petalD)"/><path d="M108 139 C86 159 78 193 94 220 C120 194 123 163 108 139" fill="#7650ad"/><path d="M108 139 C125 157 150 166 174 151 C158 127 132 124 108 139" fill="#a886db"/><path d="M109 132 C117 127 126 131 128 139 C119 145 111 143 106 138Z" fill="#f3d36e"/><path d="M108 141 C117 149 127 151 138 148" fill="none" stroke="#f5d77b" stroke-width="4" stroke-linecap="round"/>
</svg>
<div class="sparkle s1">✦</div><div class="sparkle s2">♡</div><div class="sparkle s3">✧</div><div class="sparkle s4">♡</div>
<main class="wrap">
  <div class="topline">a little letter for you</div>
  <section class="card" aria-live="polite">
    <div class="content" id="content"></div>
    <div class="actions" id="actions"></div>
  </section>
  <div class="footer">MADE WITH A LITTLE WARMTH · 11 APRIL</div>
</main>
<script>
const messages = [
  {text:"Halo, apa kabar?", hint:"Semoga kamu selalu dalam keadaan baik, ya."},
  {text:"Cieee, yang hari ini ulang tahun!", hint:"Akhirnya hari spesialmu datang juga. Selamat bertambah usia, Difani! ♡"},
  {text:"Semoga panjang umur, ya.", hint:"Semoga selalu diberi kesehatan, kebahagiaan, dan banyak hal baik di setiap langkahmu."},
  {text:"Semangat ya sama profesiannya.", hint:"Semoga semua yang sedang kamu kerjakan berjalan lancar. Tetap semangat mengejar hal-hal yang kamu impikan!"},
  {text:"Semoga kesehatanmu baik-baik aja, ya.", hint:"Jaga diri baik-baik. Semoga kamu selalu diberi kesehatan dan semakin kuat menjalani hari-hari."},
  {text:"Jangan keseringan begadang, aku tahu pasti kamu masih sering begadang, kan?", hint:"Jangan lupa istirahat yang cukup, ya. Kesehatanmu juga penting."},
  {text:"Kalau ada yang membuatmu gagal, anggap aja itu sebagai sebuah cobaan bahwasannya kamu bisa jadi lebih baik lagi.", hint:"Jangan terlalu keras sama diri sendiri. Setiap proses punya pelajarannya, dan kamu selalu punya kesempatan untuk tumbuh jadi lebih baik."},
  {text:"Semoga sesuatu yang baik selalu menghampirimu, ya.", hint:"Semoga banyak kesempatan baik, kebahagiaan, dan orang-orang tulus datang ke dalam hidupmu."},
  {text:"Semoga harimu menyenangkan selalu, ya. Dan sering-seringlah tersenyum.", hint:"Semoga hari-harimu ke depan dipenuhi hal-hal baik. Tetap jadi Difani yang penuh senyum. Selamat ulang tahun! ♡"}
];
let current = -1;
const content = document.getElementById('content');
const actions = document.getElementById('actions');
function renderIntro(){
 content.className='content intro';
 content.innerHTML=`<div class="heart">♡</div><div class="eyebrow">11 april · your special day</div><h1>Hey, Difani!</h1><p class="sub">Ada beberapa pesan kecil yang ingin disampaikan khusus untukmu. Nggak perlu buru-buru, nikmati setiap pesannya, ya.</p><div class="date">✿ &nbsp; 11 April &nbsp; ✿</div>`;
 actions.innerHTML=`<button class="btn primary" id="start">Buka surat kecil ini&nbsp; →</button>`;
 document.getElementById('start').onclick=()=>{current=0;renderMessage()};
}
function renderMessage(){
 const m=messages[current];
 content.className='content';
 content.innerHTML=`<div class="progress"><div class="bar" style="width:${((current+1)/messages.length)*100}%"></div></div><div class="eyebrow">a birthday note · ${String(current+1).padStart(2,'0')} / ${messages.length}</div><div class="message">${m.text}</div><p class="sub">${m.hint}</p>`;
 actions.innerHTML=`<button class="btn secondary" id="back">← Kembali</button><button class="btn primary" id="next">${current===messages.length-1?'Selesai ♡':'Next →'}</button>`;
 document.getElementById('back').onclick=()=>{if(current===0)renderIntro();else{current--;renderMessage()}};
 document.getElementById('next').onclick=()=>{if(current===messages.length-1)renderThankYou();else{current++;renderMessage()}};
}
function renderThankYou(){
 content.className='content intro';
 content.innerHTML=`<div class="heart">♡</div><div class="eyebrow">a little letter for you</div><h1>Happy Birthday, Difani!</h1><p class="sub">Terima kasih sudah membaca pesan kecil ini sampai selesai. Semoga tahun barumu dipenuhi kebahagiaan, kesehatan, dan hal-hal baik. Jangan lupa bahagia dan sering-sering tersenyum, ya. ♡</p><div class="celebration" aria-label="Animasi kue ulang tahun dan buket bunga iris ungu"><span class="petal-fall pf1">✿</span><span class="petal-fall pf2">✧</span><span class="petal-fall pf3">✿</span><span class="petal-fall pf4">♡</span><div class="bouquet" role="img" aria-label="Buket bunga iris ungu yang dibungkus kertas lavender">
<svg viewBox="0 0 180 220" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="wrapA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5ff"/><stop offset=".55" stop-color="#d9c4f1"/><stop offset="1" stop-color="#a98bd1"/></linearGradient>
  <linearGradient id="wrapB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee1ff"/><stop offset="1" stop-color="#b69ad9"/></linearGradient>
  <linearGradient id="irisPetal" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#eee3ff"/><stop offset=".48" stop-color="#a783db"/><stop offset="1" stop-color="#68439f"/></linearGradient>
 </defs>
 <!-- stems and leaves -->
 <g fill="none" stroke="#66875f" stroke-width="3.5" stroke-linecap="round"><path d="M88 177Q78 112 43 55M90 177Q91 111 89 40M94 178Q111 111 137 61M89 177Q65 122 68 77M93 177Q121 125 116 82"/></g>
 <g fill="#83a276"><path d="M77 143Q38 112 29 132Q49 154 80 151Z"/><path d="M99 145Q137 111 151 127Q134 151 98 154Z"/><path d="M82 119Q48 91 40 105Q59 128 83 128Z"/><path d="M105 119Q132 92 143 105Q128 128 104 130Z"/></g>
 <!-- five purple iris blooms -->
 <g>
  <g transform="translate(43 49) scale(.72)"><path d="M0 18Q-29-10-17-37Q0-27 3 2Q8-30 28-39Q39-8 8 19Q33 4 43 25Q20 43 0 18Q-18 44-40 27Q-30 3-8 13Z" fill="url(#irisPetal)"/><path d="M-4 15Q-1 1 7-5Q13 7 5 20Q-3 24-4 15Z" fill="#f0d36f"/></g>
  <g transform="translate(88 36) scale(.9)"><path d="M0 19Q-29-10-17-37Q0-27 3 2Q8-30 28-39Q39-8 8 19Q33 4 43 25Q20 43 0 18Q-18 44-40 27Q-30 3-8 13Z" fill="url(#irisPetal)"/><path d="M-4 15Q-1 1 7-5Q13 7 5 20Q-3 24-4 15Z" fill="#f5d978"/></g>
  <g transform="translate(137 58) scale(.72)"><path d="M0 18Q-29-10-17-37Q0-27 3 2Q8-30 28-39Q39-8 8 19Q33 4 43 25Q20 43 0 18Q-18 44-40 27Q-30 3-8 13Z" fill="url(#irisPetal)"/><path d="M-4 15Q-1 1 7-5Q13 7 5 20Q-3 24-4 15Z" fill="#f0d36f"/></g>
  <g transform="translate(66 83) scale(.62)"><path d="M0 18Q-29-10-17-37Q0-27 3 2Q8-30 28-39Q39-8 8 19Q33 4 43 25Q20 43 0 18Q-18 44-40 27Q-30 3-8 13Z" fill="url(#irisPetal)"/><path d="M-4 15Q-1 1 7-5Q13 7 5 20Q-3 24-4 15Z" fill="#f5d978"/></g>
  <g transform="translate(116 91) scale(.62)"><path d="M0 18Q-29-10-17-37Q0-27 3 2Q8-30 28-39Q39-8 8 19Q33 4 43 25Q20 43 0 18Q-18 44-40 27Q-30 3-8 13Z" fill="url(#irisPetal)"/><path d="M-4 15Q-1 1 7-5Q13 7 5 20Q-3 24-4 15Z" fill="#f5d978"/></g>
 </g>
 <!-- layered bouquet paper -->
 <path d="M22 91Q48 111 89 109Q133 108 158 88L126 190Q91 207 55 190Z" fill="url(#wrapA)" stroke="#b69bd7" stroke-width="1.5"/>
 <path d="M22 91Q45 119 89 126L55 190Q36 151 22 91Z" fill="#f9f2ff" opacity=".8"/>
 <path d="M158 88Q131 119 89 126L126 190Q146 146 158 88Z" fill="url(#wrapB)" opacity=".9"/>
 <path d="M55 190Q90 205 126 190L111 211Q91 218 70 209Z" fill="#c7afe4" stroke="#a88acb" stroke-width="1.2"/>
 <g class="bouquet-ribbon"><path d="M87 166Q63 151 57 169Q67 186 88 174Q106 191 122 173Q118 153 91 166Z" fill="#8862b8" stroke="#70499f" stroke-width="1.5"/><path d="M88 169L78 198L93 191L99 199L96 171Z" fill="#a987d0" stroke="#805baa" stroke-width="1.2"/><ellipse cx="91" cy="169" rx="8" ry="6" fill="#d9c3f2" stroke="#805baa" stroke-width="1.2"/></g>
</svg></div><div class="cake"><div class="flame"></div><div class="candle"></div><div class="cake-top"></div><div class="cake-layer"></div><div class="icing"><i></i><i></i><i></i><i></i><i></i></div><div class="cake-plate"></div></div></div><div class="date">✿ &nbsp; with warmth, 11 April &nbsp; ✿</div>`;
 actions.innerHTML=`<button class="btn primary" id="restart">Baca lagi ♡</button>`;
 document.getElementById('restart').onclick=()=>{current=-1;renderIntro()};
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
renderIntro();
</script>
</body>
</html>
