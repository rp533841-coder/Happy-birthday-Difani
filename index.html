<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#eee5ff" />
<title>A Little Birthday Letter — 11 April</title>
<meta name="description" content="A little birthday letter with Bubu animations on every page">
<style>
  :root{
    --ink:#302342;--muted:#766987;--purple:#8c63c5;--purple-deep:#67449e;
    --lavender:#eee5fb;--line:rgba(174,145,214,.38);
    --shadow:0 28px 90px rgba(49,29,83,.20),0 7px 24px rgba(91,62,132,.08)
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(ellipse at 8% 12%,rgba(255,255,255,.96) 0,transparent 23%),
      radial-gradient(ellipse at 92% 9%,rgba(255,188,220,.78) 0,transparent 29%),
      radial-gradient(ellipse at 78% 82%,rgba(151,126,224,.78) 0,transparent 34%),
      radial-gradient(ellipse at 14% 88%,rgba(255,211,177,.72) 0,transparent 28%),
      radial-gradient(ellipse at 50% 48%,rgba(255,255,255,.42) 0,transparent 48%),
      linear-gradient(125deg,#cbb8f2 0%,#f4cfe8 36%,#c8c9f5 70%,#f6d8ce 100%);
    background-size:180% 180%;animation:backgroundDrift 24s ease-in-out infinite alternate;
    display:grid;place-items:center;padding:30px 20px;overflow-x:hidden;position:relative}
  @keyframes backgroundDrift{0%{background-position:0% 0%}50%{background-position:70% 45%}100%{background-position:100% 100%}}
  .ambient-scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .ambient-orb{position:absolute;border-radius:50%;filter:blur(2px);mix-blend-mode:screen;opacity:.62;animation:orbFloat 17s ease-in-out infinite alternate}
  .orb-a{width:clamp(180px,27vw,390px);height:clamp(180px,27vw,390px);left:-7%;top:8%;background:radial-gradient(circle at 38% 35%,#fff 0,rgba(255,225,246,.62) 28%,rgba(255,225,246,0) 72%)}
  .orb-b{width:clamp(220px,32vw,460px);height:clamp(220px,32vw,460px);right:-10%;top:28%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.9),rgba(190,164,255,.5) 35%,transparent 72%);animation-delay:-6s}
  .orb-c{width:clamp(170px,24vw,340px);height:clamp(170px,24vw,340px);left:28%;bottom:-16%;background:radial-gradient(circle at 45% 40%,rgba(255,255,255,.9),rgba(255,202,220,.55) 38%,transparent 72%);animation-delay:-10s}
  @keyframes orbFloat{0%{transform:translate3d(0,0,0) scale(.92)}50%{transform:translate3d(35px,-24px,0) scale(1.08)}100%{transform:translate3d(-24px,28px,0) scale(1)}}
  body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;
    background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.42) 48%,transparent 72%);
    background-size:220% 100%;animation:shimmerBg 12s linear infinite}
  @keyframes shimmerBg{to{background-position:-220% 0}}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:27px 27px;
    mask-image:linear-gradient(to bottom,black,transparent 85%)}
  .sparkle{position:fixed;color:#815db6;opacity:.78;pointer-events:none;animation:float 7s ease-in-out infinite;z-index:0;text-shadow:0 0 10px #fff,0 3px 18px #fff9;filter:drop-shadow(0 4px 8px #9d7acb55)}
  .s1{top:9%;left:9%;font-size:25px}.s2{top:18%;right:12%;font-size:18px;animation-delay:1s}.s3{bottom:12%;left:14%;font-size:22px;animation-delay:2s}.s4{bottom:19%;right:9%;font-size:28px;animation-delay:3s}
  @keyframes float{50%{transform:translateY(-13px) rotate(12deg)}}
  .wrap{width:min(100%,690px);position:relative;z-index:1}
  .topline{text-align:center;margin-bottom:18px;color:#67499a;font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px}
  .topline:before,.topline:after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,#9675c4)}.topline:after{transform:rotate(180deg)}
  .card{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(250,246,255,.93));
    border:1px solid rgba(255,255,255,.92);border-radius:34px;padding:clamp(27px,6vw,58px);
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);position:relative;overflow:hidden;min-height:500px;display:flex;flex-direction:column;isolation:isolate;backdrop-filter:blur(16px)}
  .card:before{content:"";position:absolute;inset:11px;border:1px solid rgba(177,150,214,.34);border-radius:23px;pointer-events:none;z-index:-1}
  .card:after{content:"✧";position:absolute;right:32px;top:20px;color:#b89cdb;font-size:25px;opacity:.8;pointer-events:none}
  .content{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;animation:pageIn .48s cubic-bezier(.2,.75,.25,1) both}
  @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8060ae;font-weight:800;margin:5px 0 20px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(39px,8vw,59px);line-height:1.08;font-weight:500;letter-spacing:-.035em;margin:0 0 18px;color:#49345f}
  .message{font-family:Georgia,"Times New Roman",serif;font-size:clamp(25px,5vw,36px);line-height:1.36;letter-spacing:-.018em;margin:20px 0 18px;color:#49345f;text-wrap:pretty}
  .sub{font-size:15px;line-height:1.85;color:var(--muted);margin:0 0 22px;max-width:520px}
  .date{display:inline-flex;align-self:flex-start;align-items:center;gap:9px;border:1px solid rgba(174,145,214,.35);background:linear-gradient(135deg,#f8f3ff,#eee5fb);box-shadow:0 5px 16px rgba(105,74,151,.06);border-radius:99px;padding:10px 17px;color:#72529f;font-size:12px;font-weight:700;letter-spacing:.04em;margin:7px 0 23px}
  .progress{height:6px;background:#eee7f6;border-radius:20px;margin:0 0 30px;overflow:hidden;box-shadow:inset 0 1px 2px #6c4d8c12}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#cbb2ed,#8a64c2 70%,#7450a8);border-radius:20px;transition:width .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px #9b7acb66}
  .actions{display:flex;gap:14px;justify-content:space-between;align-items:center;margin-top:28px;position:relative;z-index:1}
  .btn{border:0;border-radius:99px;padding:14px 24px;font-size:13px;letter-spacing:.015em;font-weight:750;cursor:pointer;transition:transform .22s,background .22s,box-shadow .22s;min-height:48px}
  .btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0) scale(.98)}.btn:focus-visible{outline:3px solid #cbb5e8;outline-offset:3px}
  .primary{background:linear-gradient(135deg,#9b79ce,#7652ad);color:white;box-shadow:0 9px 22px rgba(111,76,160,.25),inset 0 1px #ffffff55}
  .primary:hover{background:linear-gradient(135deg,#8965c0,#67449e);box-shadow:0 12px 25px rgba(111,76,160,.32)}
  .secondary{background:rgba(239,231,249,.72);color:#775a9d;padding-left:19px;padding-right:19px;border:1px solid rgba(175,149,210,.25)}
  .secondary:disabled{opacity:.25;cursor:default;transform:none}
  .step{text-align:center;color:#a28eb9;font-size:11px;margin-top:18px;letter-spacing:.1em}
  .heart{font-size:43px;margin:2px 0 14px;color:#8e6abb;text-shadow:0 5px 15px #c7b0e855}
  .intro{text-align:center;align-items:center;justify-content:center}.intro .sub{max-width:440px}.intro h1{max-width:500px}.intro .date{align-self:center}.intro .actions{justify-content:center}
  .footer{text-align:center;color:#735b94;font-size:10px;margin-top:19px;letter-spacing:.19em;font-weight:700;opacity:.72}

  .gate-panel{width:min(100%,390px);margin:8px auto 0;padding:24px 20px 20px;border:1px solid rgba(177,150,214,.4);border-radius:25px;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(244,233,255,.9));box-shadow:0 14px 34px rgba(88,60,125,.12)}
  .gate-lock{font-size:34px;margin-bottom:8px;color:#8c68ba}
  .gate-input{width:100%;height:54px;border:1px solid #d9c8ec;border-radius:15px;background:rgba(255,255,255,.88);text-align:center;font:700 22px ui-rounded,"Segoe UI",sans-serif;letter-spacing:.48em;color:#604582;outline:none;box-shadow:inset 0 2px 5px #6f548b0d}
  .gate-input:focus{border-color:#9c7bc7;box-shadow:0 0 0 4px #bda3df35}
  .gate-error{min-height:20px;margin:10px 0 0;color:#b45b7a;font-size:12px;font-weight:700}
  .gate-panel .btn{width:100%;margin-top:12px}
  .iris{position:fixed;width:clamp(120px,19vw,245px);height:auto;opacity:.76;pointer-events:none;filter:drop-shadow(0 12px 16px rgba(67,42,111,.18));z-index:0;animation:irisFloat 9s ease-in-out infinite}
  .iris-left{left:-25px;bottom:-18px;transform:rotate(-13deg)}.iris-right{right:-24px;top:-18px;transform:rotate(165deg);animation-delay:2s}
  @keyframes irisFloat{50%{translate:0 -10px;rotate:3deg}}
  /* Finale illustration */
  .celebration{position:relative;width:min(100%,450px);height:285px;margin:8px auto 0;display:grid;place-items:end center;overflow:hidden;isolation:isolate}
  .celebration:before{content:"";position:absolute;width:330px;height:190px;bottom:0;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(214,192,241,.38),rgba(214,192,241,0) 70%);z-index:-1}
  .teddy{position:absolute;left:3px;bottom:10px;width:124px;height:160px;z-index:4;transform-origin:50% 100%;animation:teddyIn 1s .4s cubic-bezier(.2,.8,.2,1) both,teddyBob 3.8s 1.4s ease-in-out infinite;filter:drop-shadow(0 9px 10px rgba(76,49,105,.16))}
  .teddy svg{width:100%;height:100%;overflow:visible}
  .teddy-heart{transform-origin:50% 50%;animation:heartBeat 1.5s ease-in-out infinite}
  .cake{position:relative;width:190px;height:145px;z-index:2;animation:cakeIn 1s cubic-bezier(.2,.8,.2,1) both}
  .cake-top{position:absolute;left:17px;top:37px;width:156px;height:37px;border-radius:50%;background:#fff5ff;border:3px solid #d8b9f0;z-index:3;box-shadow:inset 0 -7px 0 #ead8fb}
  .cake-top:after{content:"";position:absolute;left:10px;right:10px;top:9px;height:10px;border-radius:50%;background:#d5b5f0;opacity:.75}
  .cake-layer{position:absolute;left:17px;top:54px;width:156px;height:65px;background:linear-gradient(90deg,#b995e3,#e0c9f7 48%,#a982d5);border:3px solid #c5a4e6;border-top:0;border-radius:0 0 18px 18px;box-shadow:inset 0 -9px 0 rgba(112,70,158,.13),0 13px 18px rgba(85,54,125,.15)}
  .icing{position:absolute;left:17px;top:66px;width:156px;height:22px;z-index:4;display:flex;justify-content:space-around}.icing i{display:block;width:17px;height:23px;background:#fff0fb;border-radius:0 0 12px 12px}
  .candle{position:absolute;left:91px;top:4px;width:10px;height:38px;border-radius:4px;background:repeating-linear-gradient(135deg,#fff 0 5px,#b18bdf 5px 10px);z-index:5}
  .flame{position:absolute;left:89px;top:-17px;width:14px;height:21px;background:radial-gradient(ellipse at 50% 65%,#fff6b8 0 24%,#ffc65f 45%,#f28b67 75%);border-radius:55% 45% 55% 45%;transform:rotate(8deg);filter:drop-shadow(0 0 8px #ffc76b);transform-origin:50% 100%;animation:flicker .65s ease-in-out infinite alternate}
  .cake-plate{position:absolute;left:0;bottom:13px;width:190px;height:20px;border-radius:50%;background:linear-gradient(#f8efff,#c6a8e8);box-shadow:0 8px 14px rgba(76,48,111,.13)}
  .bouquet{position:absolute;right:0;bottom:3px;width:148px;height:184px;z-index:3;transform-origin:50% 100%;animation:bouquetIn 1.15s .25s cubic-bezier(.2,.8,.2,1) both,bouquetSway 5s 1.4s ease-in-out infinite}
  .bouquet svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 9px 9px rgba(65,43,94,.16))}.bouquet-ribbon{animation:ribbonFlutter 3s ease-in-out infinite;transform-origin:50% 75%}
  .petal-fall{position:absolute;top:-20px;z-index:4;color:#a47bd2;font-size:19px;pointer-events:none;animation:petalDrift 5s linear infinite;opacity:0}
  .petal-fall.pf1{left:15%;animation-delay:.2s}.petal-fall.pf2{left:38%;animation-delay:1.7s;font-size:14px}.petal-fall.pf3{left:70%;animation-delay:.9s}.petal-fall.pf4{left:87%;animation-delay:2.5s;font-size:15px}
  @keyframes teddyIn{from{opacity:0;transform:translateY(30px) rotate(-8deg) scale(.78)}to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
  @keyframes teddyBob{0%,100%{translate:0 0;rotate:-1deg}50%{translate:0 -7px;rotate:2deg}}
  @keyframes heartBeat{0%,100%{scale:1}45%{scale:1.15}}
  @keyframes cakeIn{from{opacity:0;transform:translateY(35px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes flicker{from{transform:rotate(-7deg) scale(.92,1)}to{transform:rotate(8deg) scale(1.08,.94)}}
  @keyframes bouquetIn{from{opacity:0;transform:translateY(28px) scale(.75)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes bouquetSway{0%,100%{rotate:0deg}50%{rotate:2deg}}@keyframes ribbonFlutter{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
  @keyframes petalDrift{0%{opacity:0;transform:translateY(-10px) rotate(0)}12%{opacity:.8}85%{opacity:.7}100%{opacity:0;transform:translateY(270px) rotate(250deg)}}

  /* Mini piano birthday challenge */
  .piano-panel{width:min(100%,470px);margin:4px auto 0;padding:20px 18px 18px;border:1px solid rgba(177,150,214,.35);border-radius:24px;background:linear-gradient(145deg,#fbf8ff,#f0e7fb);box-shadow:0 12px 28px rgba(88,60,125,.09)}
  .piano-title{font:500 22px Georgia,serif;color:#533c70;margin:0 0 7px}
  .piano-copy{font-size:13px;line-height:1.65;color:#796a8d;margin:0 auto 14px;max-width:390px}
  .melody{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:390px;margin:14px auto 16px}
  .beat{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#e4d7f4;color:#7655a3;font-size:11px;font-weight:800;border:1px solid #d2bee9;transition:transform .18s,background .18s,box-shadow .18s}
  .beat.done{background:#9a79c7;color:#fff;border-color:#9a79c7}.beat.active{transform:translateY(-5px) scale(1.12);box-shadow:0 5px 14px #9b7acb66;background:#7652ad;color:#fff}
  .piano-keys{display:flex;justify-content:center;gap:7px;height:124px;margin:10px auto 14px;max-width:390px}
  .piano-key{position:relative;flex:1;max-width:83px;border:1px solid #d7c9e7;border-radius:0 0 13px 13px;background:linear-gradient(180deg,#fff 0%,#f8f4fc 80%,#e9e0f1 100%);color:#7a6693;font-weight:800;font-size:13px;box-shadow:0 6px 0 #d7c9e7,0 9px 14px #6f548b18;cursor:pointer;transition:transform .08s,box-shadow .08s,background .12s;touch-action:manipulation}
  .piano-key:before{content:"";position:absolute;top:8px;left:20%;right:20%;height:5px;border-radius:9px;background:#eee5f6}
  .piano-key:active,.piano-key.pressed{transform:translateY(5px);box-shadow:0 1px 0 #d7c9e7,0 3px 7px #6f548b18;background:#e9ddf7}
  .piano-key small{display:block;font-size:9px;font-weight:600;opacity:.65;margin-top:5px}
  .piano-status{min-height:24px;font-size:12px;color:#765b99;font-weight:700;margin:8px 0 0}
  .piano-tools{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:13px}
  .piano-tools .btn{min-height:40px;padding:10px 16px;font-size:11px}
  .piano-success{font:500 19px Georgia,serif;color:#65458f;margin:12px 0 0;animation:pageIn .35s ease both}
  /* Bubu celebrates when the complete melody is played */
  .bubu-celebrate{display:flex;align-items:center;justify-content:center;gap:13px;margin:14px auto 4px;padding:10px 16px;max-width:350px;border:1px solid #e3d5f3;border-radius:20px;background:linear-gradient(135deg,#fffaff,#f2eafd);animation:pageIn .5s ease both}
  .bubu-dance{position:relative;width:142px;height:142px;flex:0 0 142px;display:flex;align-items:center;justify-content:center;overflow:visible}
  .bubu-art{width:124px;height:137px;object-fit:contain;border-radius:14px;background:#fff;filter:drop-shadow(0 6px 7px rgba(85,60,112,.14));transform-origin:50% 88%;animation:bubuHappyDance 1.45s ease-in-out infinite}
  .bubu-float{position:absolute;z-index:2;pointer-events:none;font-family:Arial,sans-serif;font-weight:bold;animation:bubuFloat 1.8s ease-in-out infinite}
  .heart-one{left:4px;top:42px;color:#f36b91;font-size:18px;animation-delay:0s}
  .heart-two{right:3px;top:58px;color:#ee7c9c;font-size:15px;animation-delay:.55s}
  .heart-three{left:22px;bottom:4px;color:#f5a0b3;font-size:12px;animation-delay:1s}
  .sparkle-one{right:15px;top:15px;color:#e8b64f;font-size:19px;animation:bubuTwinkle .8s ease-in-out infinite alternate}
  .sparkle-two{left:9px;top:12px;color:#d5a9e8;font-size:17px;animation:bubuTwinkle 1s .35s ease-in-out infinite alternate}
  .bubu-caption{text-align:left;color:#765b99;font-size:12px;line-height:1.55;max-width:155px}
  .bubu-caption strong{display:block;color:#65458f;font:500 18px Georgia,serif;margin-bottom:3px}
  @keyframes bubuHappyDance{0%,100%{transform:translateY(2px) rotate(-3deg) scale(1)}18%{transform:translateY(-10px) rotate(3deg) scale(1.03)}36%{transform:translateY(0) rotate(-2deg) scale(.99)}55%{transform:translateY(-6px) rotate(3deg) scale(1.02)}75%{transform:translateY(1px) rotate(-1deg) scale(1)}}
  @keyframes bubuWave{from{transform:rotate(-8deg)}to{transform:rotate(23deg)}}
  @keyframes bubuTwinkle{from{opacity:.35;transform:scale(.72) rotate(-12deg)}to{opacity:1;transform:scale(1.12) rotate(12deg)}}
  @keyframes bubuFloat{0%{opacity:0;transform:translateY(9px) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translateY(-23px) scale(1.15)}}
  .piano-hint{font-size:11px;color:#9583aa;margin:5px 0 0}
  @media(max-width:520px){.piano-panel{padding:17px 12px}.piano-keys{height:112px;gap:5px}.piano-key{font-size:12px}.beat{width:25px;height:25px;gap:5px}}
  @media(max-width:520px){body{padding:17px 12px}.card{min-height:550px;border-radius:25px;padding:30px 25px}.card:before{inset:8px;border-radius:18px}.actions{margin-top:22px}.btn{padding:12px 18px;min-height:46px}.message{margin-top:12px}.iris{width:125px;opacity:.48}.iris-left{left:-48px;bottom:-20px}.iris-right{right:-48px;top:-20px}.celebration{height:245px;transform:scale(.91);transform-origin:center bottom;margin-top:0}.bouquet{right:-4px}.teddy{left:-8px;width:108px;height:145px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  @media(prefers-reduced-motion:reduce){body,.ambient-orb,.sparkle{animation:none!important}}

  /* Birthday dreamscape: warm, luminous and celebratory */
  body{
    background:
      radial-gradient(ellipse at 50% 105%,rgba(255,190,168,.72),transparent 43%),
      radial-gradient(ellipse at 5% 35%,rgba(255,224,188,.85),transparent 33%),
      radial-gradient(ellipse at 95% 26%,rgba(214,190,255,.9),transparent 36%),
      radial-gradient(ellipse at 50% -12%,rgba(255,255,255,.95),transparent 40%),
      linear-gradient(138deg,#f9cbd6 0%,#f8d9c4 27%,#d8d2f8 61%,#b8c9ee 100%);
    background-size:180% 180%; animation:birthdaySky 28s ease-in-out infinite alternate;
    isolation:isolate;
  }
  @keyframes birthdaySky{0%{background-position:0% 0%}100%{background-position:100% 100%}}
  body:before{opacity:.32;background-image:radial-gradient(circle,#fff 1.1px,transparent 1.8px),radial-gradient(circle,rgba(255,255,255,.75) 1px,transparent 1.8px);background-size:43px 43px,71px 71px;background-position:0 0,19px 27px;mask-image:linear-gradient(to bottom,black,rgba(0,0,0,.35) 72%,transparent)}
  body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.48;background:radial-gradient(ellipse at 50% 50%,transparent 28%,rgba(93,66,125,.14) 100%),linear-gradient(180deg,rgba(255,255,255,.22),transparent 34%,rgba(255,255,255,.12));}
  .ambient-scene{z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.18),transparent 55%)}
  .ambient-orb{filter:blur(1px);mix-blend-mode:screen;opacity:.8}
  .orb-a{width:clamp(250px,35vw,520px);height:clamp(250px,35vw,520px);left:-10%;top:12%;background:radial-gradient(circle,#fff9e9 0,rgba(255,199,186,.72) 28%,transparent 72%)}
  .orb-b{width:clamp(280px,39vw,570px);height:clamp(280px,39vw,570px);right:-13%;top:22%;background:radial-gradient(circle,#fff 0,rgba(192,171,255,.78) 33%,transparent 72%)}

let audioContext = null;
let masterGain = null;
let pianoReverb = null;
let dryBus = null;
let wetBus = null;
let sampleBuffers = {};
let sampleLoadPromise = null;
let demoPlaying = false;

function pianoAudio(){
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if(!AudioCtx) return null;
  if(!audioContext){
    audioContext = new AudioCtx();
    masterGain = audioContext.createGain();
    masterGain.gain.value = 0.92;

    const compressor = audioContext.createDynamicsCompressor();
    compressor.threshold.value = -18;
    compressor.knee.value = 20;
    compressor.ratio.value = 2;
    compressor.attack.value = 0.008;
    compressor.release.value = 0.24;

    dryBus = audioContext.createGain();
    dryBus.gain.value = 0.92;
    wetBus = audioContext.createGain();
    wetBus.gain.value = 0.20;

    // Warm, subtle room reverb.
    const length = Math.floor(audioContext.sampleRate * 1.6);
    const impulse = audioContext.createBuffer(2, length, audioContext.sampleRate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0; i<length; i++){
        const t = i/length;
        data[i] = (Math.random()*2-1) * Math.pow(1-t, 4.2) * 0.16;
      }
    }
    pianoReverb = audioContext.createConvolver();
    pianoReverb.buffer = impulse;

    dryBus.connect(masterGain);
    wetBus.connect(pianoReverb);
    pianoReverb.connect(masterGain);
    masterGain.connect(compressor);
    compressor.connect(audioContext.destination);
  }
  if(audioContext.state === 'suspended') audioContext.resume().catch(()=>{});
  return audioContext;
}

async function loadPianoSamples(){
  const ctx = pianoAudio();
  if(!ctx) throw new Error('Browser ini tidak mendukung Web Audio.');
  if(Object.keys(sampleBuffers).length === Object.keys(embeddedPianoSamples).length) return;
  if(!sampleLoadPromise){
    sampleLoadPromise = Promise.all(Object.entries(embeddedPianoSamples).map(async ([key, encoded])=>{
      const binary = atob(encoded);
      const bytes = new Uint8Array(binary.length);
      for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const decoded = await ctx.decodeAudioData(bytes.buffer);
      sampleBuffers[key] = decoded;
    }));
  }
  await sampleLoadPromise;
}

function playPianoNote(note, duration=1.1, velocity=0.78){
  const ctx = pianoAudio();
  if(!ctx) return;
  const sample = sampleBuffers[note];
  if(sample){
    const source = ctx.createBufferSource();
    const level = ctx.createGain();
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    source.buffer = sample;
    level.gain.setValueAtTime(0.0001, ctx.currentTime);
    level.gain.linearRampToValueAtTime(Math.max(0.08, Math.min(1, velocity)), ctx.currentTime+0.012);
    level.gain.setTargetAtTime(0.0001, ctx.currentTime+Math.max(0.15, duration), 1.8);
    if(pan){
      pan.pan.value = (pianoNotes.findIndex(n=>n.key===note)-2)*0.07;
      source.connect(level);
      level.connect(pan);
      pan.connect(dryBus);
      pan.connect(wetBus);
    }else{
      source.connect(level);
      level.connect(dryBus);
      level.connect(wetBus);
    }
    source.start();
    return;
  }

  // Audible fallback while embedded samples are still decoding.
  const item = pianoNotes.find(n=>n.key===note);
  if(!item) return;
  const now = ctx.currentTime;
  const voice = ctx.createGain();
  voice.gain.setValueAtTime(0.0001, now);
  voice.gain.linearRampToValueAtTime(0.22*velocity, now+0.012);
  voice.gain.exponentialRampToValueAtTime(0.0001, now+1.8);
  voice.connect(dryBus);
  voice.connect(wetBus);
  [1,2,3,4,5,6].forEach((harmonic, i)=>{
    const osc = ctx.createOscillator();
    const partial = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = item.freq*harmonic*(1+0.00008*harmonic*harmonic);
    partial.gain.value = [1,.42,.24,.13,.07,.035][i];
    osc.connect(partial);
    partial.connect(voice);
    osc.start(now);
    osc.stop(now+2.0);
  });
}

function renderPianoGame(){
  pianoIndex=0; demoPlaying=false;
  pianoAudio();
  loadPianoSamples().catch(err=>console.warn('Piano samples:',err));
  content.className='content intro';
  content.innerHTML=`<div class="heart">♫</div><div class="eyebrow">a tiny birthday challenge</div><h1 style="font-size:clamp(32px,7vw,48px)">Mainkan nada kecil dulu!</h1><p class="sub">Sebelum membaca suratnya, ada tantangan kecil untukmu. Dengarkan contoh melodinya, lalu mainkan urutan nada di piano sampai selesai, ya.</p><div class="piano-panel"><h2 class="piano-title">Birthday piano ♡</h2><p class="piano-copy">Tekan <b>Dengarkan contoh</b>, lalu ikuti dua bagian melodi ulang tahun. Ada 12 nada yang perlu kamu mainkan dengan urutan dan ritme santai. Dengarkan karakter nada piano yang lebih hangat dan lembut.</p><div class="melody" id="melody-beats">${birthdayTune.map((n,i)=>`<span class="beat" data-beat="${i}">${n}</span>`).join('')}</div><div class="piano-keys">${pianoNotes.map(n=>`<button class="piano-key" data-note="${n.key}" aria-label="Nada ${n.key}">${n.key}<small>♪</small></button>`).join('')}</div><div class="piano-status" id="piano-status" aria-live="polite">Siap? Dengarkan contoh melodinya dulu.</div><div class="piano-tools"><button class="btn secondary" id="demo">▶ Dengarkan contoh</button><button class="btn secondary" id="reset-piano">Ulangi</button></div><p class="piano-hint">Mainkan sampai dua bagian melodinya selesai. Kalau ada nada yang keliru, kamu bisa mulai lagi dari awal. Santai saja dan nikmati permainannya. ♡</p><div id="piano-unlock"></div></div>${bubuScene('happy','Ayo, kita main!','Bubu siap menyemangati setiap nada yang kamu tekan. 🎵')}`;
  actions.innerHTML=`<button class="btn secondary" id="piano-back">← Kembali</button><span class="step">SELESAIKAN MELODI UNTUK MEMBUKA SURAT</span>`;
  document.getElementById('piano-back').onclick=renderIntro;
  document.getElementById('demo').onclick=playDemo;
  document.getElementById('reset-piano').onclick=()=>resetPiano('Melodi diulang. Coba lagi, ya.');
  document.querySelectorAll('.piano-key').forEach(btn=>btn.addEventListener('click',()=>tapPiano(btn.dataset.note,btn)));
}
function setPianoStatus(message){const el=document.getElementById('piano-status');if(el)el.textContent=message;}
function updatePianoBeats(){
  document.querySelectorAll('.beat').forEach((el,i)=>{el.classList.toggle('done',i<pianoIndex);el.classList.toggle('active',i===pianoIndex&&pianoIndex<birthdayTune.length)});
}
function resetPiano(message='Yuk, coba mainkan lagi dari awal.'){
  demoPlaying=false;pianoIndex=0;updatePianoBeats();
  const unlock=document.getElementById('piano-unlock');if(unlock)unlock.innerHTML='';
  setPianoStatus(message);
}
async function playDemo(){
  if(demoPlaying)return;
  demoPlaying=true;resetPiano('Menyiapkan suara piano…');demoPlaying=true;
  try{ await loadPianoSamples(); }
  catch(err){ demoPlaying=false; setPianoStatus('Audio tidak dapat dimuat di browser ini. Coba buka file melalui Chrome.'); return; }
  setPianoStatus('Dengarkan baik-baik, ya…');
  const demoBtn=document.getElementById('demo');if(demoBtn)demoBtn.disabled=true;
  for(let i=0;i<birthdayTune.length;i++){
    if(!document.getElementById('piano-status'))break;
    document.querySelectorAll('.beat').forEach((el,j)=>el.classList.toggle('active',j===i));
    const key=document.querySelector(`[data-note="${birthdayTune[i]}"]`);
    if(key)key.classList.add('pressed');
    playPianoNote(birthdayTune[i],1.05,0.68 + (i % 3) * 0.10);
    await new Promise(r=>setTimeout(r,720));
    if(key)key.classList.remove('pressed');
  }
  document.querySelectorAll('.beat').forEach(el=>el.classList.remove('active'));
  demoPlaying=false;
  if(demoBtn)demoBtn.disabled=false;
  setPianoStatus('Sekarang giliranmu! Mainkan 12 nada dalam dua bagian, sesuai urutan contoh.');
}
function tapPiano(note,button){
  if(demoPlaying||pianoIndex>=birthdayTune.length)return;
  playPianoNote(note,1.05,0.78);
  button.classList.add('pressed');setTimeout(()=>button.classList.remove('pressed'),130);
  if(note===birthdayTune[pianoIndex]){
    pianoIndex++;updatePianoBeats();
    if(pianoIndex===birthdayTune.length){
      setPianoStatus('Yeay! Melodinya berhasil kamu mainkan! ♡');
      const unlock=document.getElementById('piano-unlock');
      unlock.innerHTML=`<div class="piano-success">Kamu berhasil memainkan seluruh ritmenya!</div>
        <div class="bubu-celebrate" role="status" aria-label="Bubu si beruang putih melompat gembira merayakan keberhasilanmu">
          <div class="bubu-dance" aria-label="Bubu panda merayakan keberhasilan dengan melompat dan bergoyang"><span class="bubu-float heart-one">♥</span><span class="bubu-float heart-two">♥</span><span class="bubu-float heart-three">♥</span><span class="bubu-float sparkle-one">✦</span><span class="bubu-float sparkle-two">✧</span><img class="bubu-art" src="https://media.tenor.com/xggBaDYUIaIAAAAj/dudu-bubu.gif" alt="Animasi GIF panda putih Bubu dengan telinga cokelat dan pipi merah muda membentuk hati dengan tangannya" loading="eager"></div>

          <div class="bubu-caption"><strong>Yeay, hebat!</strong>Bubu ikut senang! Kamu berhasil menyelesaikan melodinya ♡</div>
        </div>
        <button class="btn primary" id="unlock-letter" style="margin-top:12px">Lanjut ke ucapan pertama →</button>`;
      document.getElementById('unlock-letter').onclick=()=>{current=0;renderMessage()};
    }else setPianoStatus(`Bagus! ${pianoIndex} dari ${birthdayTune.length} nada sudah tepat. Lanjutkan, ya.`);
  }else{
    setPianoStatus('Hampir! Coba ikuti urutan nada dari awal lagi, ya.');
    pianoIndex=0;updatePianoBeats();
  }
}

function renderMessage(){
 const m=messages[current];
 content.className='content';
 const bubuMoods=[
  ['heart','Bubu menyapa balik','Semoga harimu dimulai dengan hangat dan menyenangkan.'],
  ['happy','Bubu ikut pesta!','Hari ini waktunya merayakan semua hal baik tentang dirimu. 🎉'],
  ['hug','Peluk hangat dari Bubu','Semoga kesehatan dan kebahagiaan selalu menemanimu.'],
  ['heart','Bubu menyemangati','Pelan-pelan saja, setiap langkah kecil tetap berarti. ✨'],
  ['hug','Bubu ingin kamu sehat','Jangan lupa menjaga diri dan memberi waktu untuk beristirahat.'],
  ['sleep','Waktunya istirahat','Bubu juga mengingatkan: tidur cukup itu penting, ya. 🌙'],
  ['heart','Bubu percaya padamu','Kalau hari terasa berat, tetaplah percaya bahwa kamu bisa bertumbuh.'],
  ['happy','Bubu kirim keberuntungan','Semoga kejutan baik datang satu per satu ke hidupmu. 🍀'],
  ['happy','Senyum untuk hari ini','Bubu ikut tersenyum melihatmu terus melangkah. ♡']
];
 const mood=bubuMoods[current]||bubuMoods[0];
 content.innerHTML=`<div class="progress"><div class="bar" style="width:${((current+1)/messages.length)*100}%"></div></div><div class="eyebrow">a birthday note · ${String(current+1).padStart(2,'0')} / ${messages.length}</div><div class="message">${m.text}</div><p class="sub">${m.hint}</p>${bubuScene(mood[0],mood[1],mood[2])}`;
 actions.innerHTML=`<button class="btn secondary" id="back">← Kembali</button><button class="btn primary" id="next">${current===messages.length-1?'Selesai ♡':'Next →'}</button>`;
 document.getElementById('back').onclick=()=>{if(current===0)renderIntro();else{current--;renderMessage()}};
 document.getElementById('next').onclick=()=>{if(current===messages.length-1)renderThankYou();else{current++;renderMessage()}};
}
